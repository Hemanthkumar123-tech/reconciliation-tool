
<script>
"use strict";

const state = {
    client: null,
    fivec: null,
    results: null,
    summary: null
};

const $ = id => document.getElementById(id);

function setStatus(message, type = "") {
    $("statusText").textContent = message;
    $("statusDot").className = "status-dot" + (type ? " " + type : "");
}

function normalizeId(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim().toUpperCase();
}

function normalizeHeader(value) {
    return String(value ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function makeUniqueHeaders(headers) {
    const used = new Map();

    return headers.map((value, index) => {
        let name = String(value ?? "").trim() || "Column " + (index + 1);
        const count = used.get(name) || 0;
        used.set(name, count + 1);
        return count === 0 ? name : name + " (" + (count + 1) + ")";
    });
}

function detectHeaderRow(matrix) {
    const known = [
        "PATIENTID", "PATIENTIDENTIFIER", "MRN",
        "UHID", "PATIENTNAME", "ORDERID",
        "ACCESSIONNUMBER", "ACCESSIONNO",
        "STUDYID", "VISITID"
    ];

    let bestIndex = 0;
    let bestScore = -1;

    const limit = Math.min(matrix.length, 50);

    for (let i = 0; i < limit; i++) {
        const values = (matrix[i] || []).map(normalizeHeader);
        const nonEmpty = values.filter(Boolean).length;

        if (nonEmpty === 0) continue;

        const knownMatches = values.reduce((total, value) =>
            total + (known.some(key =>
                value === key || value.includes(key)
            ) ? 1 : 0), 0
        );

        const score =
            knownMatches * 10 +
            Math.min(nonEmpty, 20) * 0.1;

        if (score > bestScore) {
            bestScore = score;
            bestIndex = i;
        }
    }

    return bestIndex;
}

function matrixToSheet(name, matrix) {
    if (!matrix || !matrix.length) {
        return { name, headers: [], rows: [] };
    }

    const headerIndex = detectHeaderRow(matrix);
    const headers = makeUniqueHeaders(matrix[headerIndex] || []);
    const rows = [];

    for (let i = headerIndex + 1; i < matrix.length; i++) {
        const source = matrix[i] || [];
        const object = {};

        headers.forEach((header, col) => {
            object[header] = source[col] ?? "";
        });

        if (Object.values(object).some(v => String(v).trim() !== "")) {
            object.__sourceRow = i + 1;
            rows.push(object);
        }
    }

    return { name, headers, rows };
}

async function parseFile(file) {
    const ext = file.name.split(".").pop().toLowerCase();

    if (["xlsx", "xls", "xlsm", "xlsb", "csv"].includes(ext)) {
        if (!window.XLSX) {
            throw new Error("Excel library is unavailable.");
        }

        const buffer = await file.arrayBuffer();

        const workbook = XLSX.read(buffer, {
            type: "array",
            cellDates: false,
            raw: false
        });

        const sheets = workbook.SheetNames.map(name => {
            const matrix = XLSX.utils.sheet_to_json(
                workbook.Sheets[name],
                { header: 1, defval: "", raw: false }
            );

            return matrixToSheet(name, matrix);
        });

        return { fileName: file.name, sheets };
    }

    if (ext === "json") {
        const data = JSON.parse(await file.text());
        const array = Array.isArray(data) ? data : [data];

        const headers = [...new Set(array.flatMap(item =>
            item && typeof item === "object" && !Array.isArray(item)
                ? Object.keys(item)
                : ["Value"]
        ))];

        const rows = array.map((item, index) => {
            const row = item && typeof item === "object" && !Array.isArray(item)
                ? { ...item }
                : { Value: item };

            row.__sourceRow = index + 1;
            return row;
        });

        return {
            fileName: file.name,
            sheets: [{
                name: "JSON Data",
                headers,
                rows
            }]
        };
    }

    if (["txt", "log"].includes(ext)) {
        const lines = (await file.text())
            .split(/\r?\n/)
            .filter(x => x.trim());

        return {
            fileName: file.name,
            sheets: [{
                name: "Text Document",
                headers: ["Text"],
                rows: lines.map((Text, index) => ({
                    Text,
                    __sourceRow: index + 1
                }))
            }]
        };
    }

    if (["html", "htm"].includes(ext)) {
        const text = await file.text();
        const doc = new DOMParser().parseFromString(text, "text/html");
        const tables = [...doc.querySelectorAll("table")];

        if (tables.length) {
            return {
                fileName: file.name,
                sheets: tables.map((table, index) => {
                    const matrix = [...table.querySelectorAll("tr")].map(tr =>
                        [...tr.querySelectorAll("th,td")]
                            .map(cell => cell.textContent.trim())
                    );

                    return matrixToSheet("Table " + (index + 1), matrix);
                })
            };
        }

        const lines = (doc.body.innerText || "")
            .split(/\r?\n/)
            .filter(x => x.trim());

        return {
            fileName: file.name,
            sheets: [{
                name: "HTML Document",
                headers: ["Text"],
                rows: lines.map((Text, index) => ({
                    Text,
                    __sourceRow: index + 1
                }))
            }]
        };
    }

    if (ext === "pdf") {
        throw new Error(
            "PDF files are not supported by this version. " +
            "Please convert the PDF to Excel or CSV before uploading. " +
            "Scanned PDFs require OCR."
        );
    }

    throw new Error(
        "Unsupported file type. Use Excel, CSV, JSON, TXT, or HTML."
    );
}

function suggestKey(headers) {
    const exact = [
        "PATIENTID",
        "PATIENTIDENTIFIER",
        "PATIENTIDNO",
        "UHID",
        "MRN",
        "MEDICALRECORDNUMBER"
    ];

    let index = headers.findIndex(h =>
        exact.includes(normalizeHeader(h))
    );

    if (index >= 0) return index;

    return headers.findIndex(h => {
        const n = normalizeHeader(h);
        return n.includes("PATIENTID") ||
            n === "UHID" ||
            n === "MRN";
    });
}

function fillSelect(select, options, placeholder) {
    select.innerHTML = "";

    options.forEach(option => {
        const el = document.createElement("option");
        el.value = option.value;
        el.textContent = option.label;
        select.appendChild(el);
    });

    select.disabled = options.length === 0;

    if (!options.length) {
        const el = document.createElement("option");
        el.value = "";
        el.textContent = placeholder;
        select.appendChild(el);
    }
}

function populateSide(side) {
    const data = state[side];
    const sheetSelect = $(side + "Sheet");
    const keySelect = $(side + "Key");

    if (!data) {
        fillSelect(sheetSelect, [], "Upload file first");
        fillSelect(keySelect, [], "Select worksheet first");
        updateButton();
        return;
    }

    fillSelect(sheetSelect, data.sheets.map(s => ({
        value: s.name,
        label: s.name + " (" + s.rows.length + " records)"
    })), "No worksheets");

    sheetSelect.onchange = () => populateKeys(side);
    populateKeys(side);
}

function activeSheet(side) {
    const data = state[side];

    if (!data) return null;

    return data.sheets.find(s =>
        s.name === $(side + "Sheet").value
    ) || null;
}

function populateKeys(side) {
    const sheet = activeSheet(side);
    const select = $(side + "Key");

    if (!sheet || !sheet.headers.length) {
        fillSelect(select, [], "No columns available");
        updateButton();
        return;
    }

    fillSelect(select, sheet.headers.map(h => ({
        value: h,
        label: h
    })), "Select column");

    const suggested = suggestKey(sheet.headers);

    if (suggested >= 0) {
        select.selectedIndex = suggested;
    }

    select.onchange = updateButton;
    updateButton();
}

function updateButton() {
    $("compareBtn").disabled = !(
        state.client &&
        state.fivec &&
        $("clientSheet").value &&
        $("fivecSheet").value &&
        $("clientKey").value &&
        $("fivecKey").value
    );
}

async function handleUpload(side, file) {
    $(side + "FileName").style.display = "block";
    $(side + "FileName").textContent = "📎 " + file.name;

    setStatus("Reading " + file.name + "...", "loading");

    try {
        const parsed = await parseFile(file);

        state[side] = parsed;
        state.results = null;
        state.summary = null;

        $("exportBtn").disabled = true;

        populateSide(side);

        $("tableContainer").innerHTML =
            '<div class="empty-results">Select documents and click Compare Documents.</div>';

        setStatus(
            side.toUpperCase() + " file loaded: " + file.name,
            "success"
        );

    } catch (error) {
        console.error(error);

        state[side] = null;
        state.results = null;
        state.summary = null;

        $("exportBtn").disabled = true;

        populateSide(side);

        setStatus(
            "Unable to read file: " + error.message,
            "error"
        );
    }
}

function setupDropZone(side) {
    const drop = $(side + "Drop");
    const input = $(side + "File");

    drop.addEventListener("click", () => input.click());

    input.addEventListener("change", () => {
        if (input.files[0]) {
            handleUpload(side, input.files[0]);
        }
    });

    drop.addEventListener("dragover", event => {
        event.preventDefault();
        drop.classList.add("dragover");
    });

    drop.addEventListener("dragleave", () => {
        drop.classList.remove("dragover");
    });

    drop.addEventListener("drop", event => {
        event.preventDefault();
        drop.classList.remove("dragover");

        const file = event.dataTransfer.files[0];

        if (file) {
            handleUpload(side, file);
        }
    });
}

function groupRecords(rows, key) {
    const map = new Map();

    rows.forEach(row => {
        const id = normalizeId(row[key]);

        if (!id) return;

        if (!map.has(id)) {
            map.set(id, []);
        }

        map.get(id).push(row);
    });

    return map;
}

function compareDocuments() {
    const clientSheet = activeSheet("client");
    const fivecSheet = activeSheet("fivec");

    if (!clientSheet || !fivecSheet) {
        setStatus("Select valid worksheets.", "error");
        return;
    }

    const clientKey = $("clientKey").value;
    const fivecKey = $("fivecKey").value;

    setStatus("Comparing Patient IDs...", "loading");

    const clientMap = groupRecords(clientSheet.rows, clientKey);
    const fivecMap = groupRecords(fivecSheet.rows, fivecKey);

    const allIds = new Set([
        ...clientMap.keys(),
        ...fivecMap.keys()
    ]);

    const results = [];
    const matched = [];
    const missing = [];
    const onlyFivec = [];
    const duplicates = [];
    const occurrenceDetails = [];

    let clientBlank = 0;
    let fivecBlank = 0;

    clientSheet.rows.forEach(row => {
        if (!normalizeId(row[clientKey])) {
            clientBlank++;
        }
    });

    fivecSheet.rows.forEach(row => {
        if (!normalizeId(row[fivecKey])) {
            fivecBlank++;
        }
    });

    for (const id of allIds) {
        const cRows = clientMap.get(id) || [];
        const fRows = fivecMap.get(id) || [];

        const commonCount = Math.min(
            cRows.length,
            fRows.length
        );

        const clientExcess = Math.max(
            0,
            cRows.length - fRows.length
        );

        const fivecExcess = Math.max(
            0,
            fRows.length - cRows.length
        );

        let status;

        if (cRows.length && fRows.length) {
            status = "MATCH";
        } else if (cRows.length) {
            status = "MISSING IN 5C";
        } else {
            status = "ONLY IN 5C";
        }

        const result = {
            "Patient ID": id,
            "Status": status,
            "Client Occurrences": cRows.length,
            "5C Occurrences": fRows.length,
            "Matched Occurrences": commonCount,
            "Client Excess": clientExcess,
            "5C Excess": fivecExcess,
            "Client Source Rows": cRows.map(r => r.__sourceRow).join(", "),
            "5C Source Rows": fRows.map(r => r.__sourceRow).join(", ")
        };

        results.push(result);

        if (commonCount > 0) {
            matched.push(result);
        }

        if (clientExcess > 0) {
            missing.push({
                "Patient ID": id,
                "Status": "MISSING IN 5C",
                "Missing Occurrences": clientExcess,
                "Client Occurrences": cRows.length,
                "5C Occurrences": fRows.length,
                "Client Excess Source Rows": cRows
                    .slice(fRows.length)
                    .map(r => r.__sourceRow)
                    .join(", "),
                "5C Source Rows": fRows
                    .map(r => r.__sourceRow)
                    .join(", ")
            });
        }

        if (fivecExcess > 0) {
            onlyFivec.push({
                "Patient ID": id,
                "Status": "ONLY IN 5C",
                "Extra Occurrences": fivecExcess,
                "Client Occurrences": cRows.length,
                "5C Occurrences": fRows.length,
                "Client Source Rows": cRows
                    .map(r => r.__sourceRow)
                    .join(", "),
                "5C Excess Source Rows": fRows
                    .slice(cRows.length)
                    .map(r => r.__sourceRow)
                    .join(", ")
            });
        }

        if (cRows.length > 1 || fRows.length > 1) {
            duplicates.push({
                "Patient ID": id,
                "Client Occurrences": cRows.length,
                "5C Occurrences": fRows.length,
                "Client Duplicate": cRows.length > 1 ? "Yes" : "No",
                "5C Duplicate": fRows.length > 1 ? "Yes" : "No",
                "Client Source Rows": cRows
                    .map(r => r.__sourceRow)
                    .join(", "),
                "5C Source Rows": fRows
                    .map(r => r.__sourceRow)
                    .join(", ")
            });
        }

        const maxCount = Math.max(cRows.length, fRows.length);

        for (let i = 0; i < maxCount; i++) {
            const cRow = cRows[i] || null;
            const fRow = fRows[i] || null;

            let occurrenceStatus;

            if (cRow && fRow) {
                occurrenceStatus = "MATCH";
            } else if (cRow) {
                occurrenceStatus = "MISSING IN 5C";
            } else {
                occurrenceStatus = "ONLY IN 5C";
            }

            occurrenceDetails.push({
                "Patient ID": id,
                "Occurrence Number": i + 1,
                "Status": occurrenceStatus,
                "Client Source Row": cRow ? cRow.__sourceRow : "",
                "5C Source Row": fRow ? fRow.__sourceRow : ""
            });
        }
    }

    const sortById = (a, b) =>
        a["Patient ID"].localeCompare(b["Patient ID"]);

    results.sort(sortById);
    matched.sort(sortById);
    missing.sort(sortById);
    onlyFivec.sort(sortById);
    duplicates.sort(sortById);
    occurrenceDetails.sort((a, b) =>
        a["Patient ID"].localeCompare(b["Patient ID"]) ||
        a["Occurrence Number"] - b["Occurrence Number"]
    );

    const clientUnique = clientMap.size;
    const fivecUnique = fivecMap.size;

    const matchingUnique = [...clientMap.keys()]
        .filter(id => fivecMap.has(id)).length;

    const matchedOccurrences = occurrenceDetails
        .filter(row => row.Status === "MATCH").length;

    const missingOccurrences = occurrenceDetails
        .filter(row => row.Status === "MISSING IN 5C").length;

    const onlyFivecOccurrences = occurrenceDetails
        .filter(row => row.Status === "ONLY IN 5C").length;

    const clientDuplicateOccurrences = [...clientMap.values()]
        .reduce((n, a) => n + Math.max(0, a.length - 1), 0);

    const fivecDuplicateOccurrences = [...fivecMap.values()]
        .reduce((n, a) => n + Math.max(0, a.length - 1), 0);

    state.results = {
        all: results,
        matched,
        missing,
        onlyFivec,
        duplicates,
        occurrenceDetails
    };

    state.summary = {
        "Client File": state.client.fileName,
        "5C File": state.fivec.fileName,
        "Client Worksheet": clientSheet.name,
        "5C Worksheet": fivecSheet.name,
        "Client ID Column": clientKey,
        "5C ID Column": fivecKey,
        "Client Data Rows": clientSheet.rows.length,
        "5C Data Rows": fivecSheet.rows.length,
        "Client Blank IDs": clientBlank,
        "5C Blank IDs": fivecBlank,
        "Client Unique IDs": clientUnique,
        "5C Unique IDs": fivecUnique,
        "Matching Unique IDs": matchingUnique,
        "Matched Occurrences": matchedOccurrences,
        "Missing in 5C Occurrences": missingOccurrences,
        "Only in 5C Occurrences": onlyFivecOccurrences,
        "Missing Unique IDs": missing.length,
        "Only in 5C Unique IDs": onlyFivec.length,
        "IDs with duplicates": duplicates.length,
        "Client Total Duplicate Occurrences": clientDuplicateOccurrences,
        "5C Total Duplicate Occurrences": fivecDuplicateOccurrences,
        "Client Reconciliation Check":
            clientSheet.rows.length ===
            matchedOccurrences + missingOccurrences + clientBlank
                ? "PASS"
                : "CHECK",
        "5C Reconciliation Check":
            fivecSheet.rows.length ===
            matchedOccurrences + onlyFivecOccurrences + fivecBlank
                ? "PASS"
                : "CHECK"
    };

    $("clientCount").textContent =
        clientUnique.toLocaleString();

    $("fivecCount").textContent =
        fivecUnique.toLocaleString();

    $("matchCount").textContent =
        matchingUnique.toLocaleString();

    $("missingCount").textContent =
        missingOccurrences.toLocaleString();

    renderResults(results);

    $("exportBtn").disabled = false;

    setStatus(
        "Comparison completed. " +
        matchingUnique.toLocaleString() +
        " matching unique IDs, " +
        missingOccurrences.toLocaleString() +
        " unmatched Client occurrences, and " +
        onlyFivecOccurrences.toLocaleString() +
        " extra 5C occurrences.",
        "success"
    );
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderResults(rows) {
    const container = $("tableContainer");

    if (!rows.length) {
        container.innerHTML =
            '<div class="empty-results">No comparison results found.</div>';
        return;
    }

    const visible = rows.slice(0, 5000);

    const headers = [
        "Patient ID",
        "Status",
        "Client Occurrences",
        "5C Occurrences",
        "Matched Occurrences",
        "Client Excess",
        "5C Excess",
        "Client Source Rows",
        "5C Source Rows"
    ];

    let html = "<table><thead><tr>";

    headers.forEach(h => {
        html += "<th>" + escapeHtml(h) + "</th>";
    });

    html += "</tr></thead><tbody>";

    visible.forEach(row => {
        const cls = row.Status === "MATCH"
            ? "match"
            : row.Status === "MISSING IN 5C"
                ? "missing"
                : "extra";

        html += "<tr>";

        headers.forEach(h => {
            html += '<td class="' +
                (h === "Status" ? cls : "") +
                '">' +
                escapeHtml(row[h]) +
                "</td>";
        });

        html += "</tr>";
    });

    html += "</tbody></table>";

    if (rows.length > 5000) {
        html +=
            '<div class="empty-results">Showing first 5,000 of ' +
            rows.length.toLocaleString() +
            ' unique IDs. Export contains all records.</div>';
    }

    container.innerHTML = html;
}

function exportResults() {
    if (!state.results || !state.summary) {
        setStatus(
            "Please compare documents before exporting.",
            "error"
        );
        return;
    }

    const workbook = XLSX.utils.book_new();

    function addSheet(name, data) {
        const ws = XLSX.utils.json_to_sheet(data);
        XLSX.utils.book_append_sheet(workbook, ws, name);
    }

    addSheet(
        "Summary",
        Object.entries(state.summary).map(([Metric, Value]) => ({
            Metric,
            Value
        }))
    );

    addSheet("All Comparison", state.results.all);
    addSheet("Matched", state.results.matched);
    addSheet("Missing in 5C", state.results.missing);
    addSheet("Only in 5C", state.results.onlyFivec);
    addSheet("Duplicate IDs", state.results.duplicates);
    addSheet("Occurrence Details", state.results.occurrenceDetails);

    const now = new Date();

    const stamp =
        now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0") + "_" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0");

    XLSX.writeFile(
        workbook,
        "Patient_ID_Comparison_" + stamp + ".xlsx"
    );

    setStatus(
        "Comparison workbook exported successfully.",
        "success"
    );
}

function resetAll() {
    state.client = null;
    state.fivec = null;
    state.results = null;
    state.summary = null;

    $("clientFile").value = "";
    $("fivecFile").value = "";

    $("clientFileName").style.display = "none";
    $("fivecFileName").style.display = "none";

    [
        "clientSheet",
        "fivecSheet",
        "clientKey",
        "fivecKey"
    ].forEach(id => {
        const select = $(id);
        select.innerHTML =
            '<option value="">Upload file first</option>';
        select.disabled = true;
    });

    [
        "clientCount",
        "fivecCount",
        "matchCount",
        "missingCount"
    ].forEach(id => {
        $(id).textContent = "0";
    });

    $("compareBtn").disabled = true;
    $("exportBtn").disabled = true;

    $("tableContainer").innerHTML =
        '<div class="empty-results">Select documents and click Compare Documents.</div>';

    setStatus("Please select both documents.");
}

setupDropZone("client");
setupDropZone("fivec");

$("compareBtn").addEventListener("click", compareDocuments);
$("exportBtn").addEventListener("click", exportResults);
$("resetBtn").addEventListener("click", resetAll);

resetAll();
</script>
